<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkSafe｜求職風險查詢</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="anonymous">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><strong>⚡ WorkSafe</strong><span>大學生打工避雷平台 · PostgreSQL 連線版</span></header>
<main>
<section class="panel">
<h1>查詢歷史裁罰紀錄</h1>
<p class="intro">使用勞動部公開裁罰資料，依原始雇主名稱搜尋。分數為專題自訂指標，非官方評等。</p>
<label for="search">企業名稱</label>
<div class="searchrow"><input id="search" placeholder="輸入公司名稱關鍵字" maxlength="100"><button id="searchButton">搜尋</button></div>
<div id="status" class="status" role="status">正在載入資料…</div>
<div id="results" class="results"></div>
<section id="detail" class="detail"><h2>裁罰明細</h2><p>請先點選搜尋結果中的企業。</p></section>
<p class="note">⚠️ 尚未驗證企業位置，地圖不會放置真實企業圖釘。公司名稱可能包含負責人，且裁罰案件與企業身分仍待核對；未列金額不代表罰鍰為零。</p>
<p class="source">資料來源：<a href="https://announcement.mol.gov.tw/" target="_blank" rel="noopener noreferrer">勞動部違反勞動法令事業單位查詢系統</a></p>
</section>
<section class="maparea"><div id="map"></div><div class="mapnote">📍 地圖已就緒｜待完成企業地址比對後才加入真實標記</div></section>
</main>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin="anonymous"></script>
<script src="/app.js"></script>
</body>
</html>
